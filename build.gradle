plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.3'
	id 'io.spring.dependency-management' version '1.1.6'
	id 'org.asciidoctor.jvm.convert' version '3.3.2'
}

group = 'site.thedeny'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}

	asciidoctorExt
}

repositories {
	mavenCentral()
}

ext {
	snippetsDir = file('build/generated-snippets')
}

dependencies {
	// WebFlux
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	// Security / OAuth2
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	// Bearer JWT 검증에 필요한 JwtEncoder/JwtDecoder와 Resource Server 필터를 제공한다.
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

	// MongoDB
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb-reactive'

	// R2DBC
	implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
	// H2R2dbcConfig가 H2ConnectionFactory를 직접 사용하므로 compile classpath에도 필요하다.
	implementation 'io.r2dbc:r2dbc-h2'
	// H2ServerConfig가 org.h2.tools.Server를 직접 사용하므로 runtimeOnly로 둘 수 없다.
	implementation 'com.h2database:h2'
	runtimeOnly 'org.mariadb:r2dbc-mariadb'

	// JDBC가 실제로 필요한 경우에만 유지
	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

	// Redis
	implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// 개발 도구
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// REST Docs
	asciidoctorExt 'org.springframework.restdocs:spring-restdocs-asciidoctor'
	testImplementation 'org.springframework.restdocs:spring-restdocs-webtestclient'

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'io.projectreactor:reactor-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// P6Spy는 JDBC 전용이며 R2DBC 쿼리는 감시하지 못함
	// implementation 'com.github.gavlyukovskiy:p6spy-spring-boot-starter:1.9.0'
}

tasks.named('test') {
	useJUnitPlatform()
	outputs.dir snippetsDir
}

tasks.named('asciidoctor') {
	inputs.dir snippetsDir
	configurations 'asciidoctorExt'
	dependsOn tasks.named('test')
}

tasks.named('bootJar') {
	dependsOn tasks.named('asciidoctor')

	from(tasks.named('asciidoctor').get().outputDir) {
		into 'static/docs'
	}
}
